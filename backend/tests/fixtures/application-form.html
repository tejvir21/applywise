<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Application Form</title>
</head>
<body>
  <h1>Job Application</h1>
  <form id="application-form">
    <div>
      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName" name="fullName" required aria-required="true" />
    </div>
    <div>
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" required aria-required="true" />
    </div>
    <div>
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" />
    </div>
    <div>
      <label for="location">Current Location</label>
      <input type="text" id="location" name="location" />
    </div>
    <div>
      <label for="experience">Years of Experience</label>
      <input type="number" id="experience" name="experience" />
    </div>
    <div>
      <label for="skills">Key Skills</label>
      <textarea id="skills" name="skills" rows="3"></textarea>
    </div>
    <div>
      <label for="resume">Resume Upload *</label>
      <input type="file" id="resume" name="resume" required aria-required="true" accept=".pdf,.docx" />
    </div>
    <div>
      <label for="coverLetter">Cover Letter</label>
      <textarea id="coverLetter" name="coverLetter" rows="5"></textarea>
    </div>
    <div>
      <label for="salary">Expected Salary</label>
      <input type="text" id="salary" name="salary" />
    </div>
    <div>
      <label for="notice">Notice Period</label>
      <input type="text" id="notice" name="notice" />
    </div>
    <div>
      <label>Work Authorization *</label>
      <input type="radio" id="auth-yes" name="workAuth" value="yes" required />
      <label for="auth-yes">Yes, I am authorized to work</label>
      <input type="radio" id="auth-no" name="workAuth" value="no" />
      <label for="auth-no">No</label>
    </div>
    <div>
      <label for="education">Highest Education</label>
      <select id="education" name="education">
        <option value="">Select...</option>
        <option value="bachelors">Bachelor's Degree</option>
        <option value="masters">Master's Degree</option>
        <option value="phd">PhD</option>
      </select>
    </div>
    <div>
      <label for="customQuestion">Why do you want to work here?</label>
      <textarea id="customQuestion" name="customQuestion" rows="3"></textarea>
    </div>
    <div>
      <label>CAPTCHA Challenge</label>
      <div id="captcha" class="captcha-container">Please solve CAPTCHA to continue</div>
    </div>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
